name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test-and-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -c "import sqlite3; print(sqlite3.sqlite_version); assert sqlite3.sqlite_version_info >= (3, 37)"
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_demo.py
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/smoke_package.py dist/sqlite_sprig-0.1.0a1-py3-none-any.whl
