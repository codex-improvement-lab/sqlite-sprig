[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sqlite-sprig"
version = "0.1.0a1"
description = "Extract a SQLite branch with its ordinary schema and required parents."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Elias S. W. / Codex Improvement Lab"}]
keywords = ["sqlite", "subset", "fixtures", "agents", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Database",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.scripts]
sqlite-sprig = "sqlite_sprig:main"

[project.urls]
Repository = "https://github.com/codex-improvement-lab/sqlite-sprig"
Issues = "https://github.com/codex-improvement-lab/sqlite-sprig/issues"

[tool.setuptools]
py-modules = ["sqlite_sprig"]
