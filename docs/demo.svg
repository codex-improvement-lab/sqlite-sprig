<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-label="SQLite Sprig: one record with its context. An authored example retains 11 of 24 rows.">
<style>
text{font-family:Segoe UI,Arial,sans-serif;fill:#19252b}
.traces{stroke:#95a299;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}
.column-label{font-size:9px;letter-spacing:1.1px;fill:#788076}
.node rect{fill:#fafbf6;stroke:#c7d0c5;stroke-width:1}
.node-label{font-size:9px;letter-spacing:1px;fill:#6b796c}
.node-count{font-size:12px;text-anchor:end;fill:#52664f}
.node-value{font-size:14px;fill:#354634}
.root rect{fill:url(#paper);stroke:#cd8c69}
.root-label{font-size:9px;letter-spacing:.8px;fill:#7f4b32}
.root-id{font-size:39px;letter-spacing:-1.8px;font-weight:500;fill:#4a3427}
.root-state{font-size:10px;fill:#7f4b32}
.child rect{fill:#f5f7f5;stroke:#becbc8}
.child .node-label{fill:#647a78}
.child-count{font-size:26px;fill:#3d5856}
.child-detail{font-size:11px;fill:#738481}
.diagram-note{font-size:10px;fill:#7a8079}
</style><rect width="1280" height="760" fill="#f2f0ea"/>
<g transform="translate(64 32)" fill="none" stroke="#b84b29" stroke-width="1.6"><path d="M18 36V9M18 24C7 24 5 17 5 10c8 0 13 5 13 14ZM18 16C18 7 24 3 31 3c0 8-5 13-13 13Z"/></g>
<text x="113" y="61" font-size="25">SQLite <tspan font-weight="600">Sprig</tspan></text>
<text x="1216" y="59" font-size="12" text-anchor="end" fill="#6b756d">LOCAL SQLITE · ALPHA 0.1</text>
<path d="M64 96H1216" stroke="#d5d7cf"/>
<text x="64" y="184" font-size="11" letter-spacing="1.5" fill="#626b6a">A BRANCH YOU CAN WORK WITH</text>
<text x="60" y="274" font-size="70" letter-spacing="-3.5">One record.</text>
<text x="60" y="347" font-size="70" letter-spacing="-3.5">With its</text>
<text x="60" y="420" font-size="70" letter-spacing="-3.5" style="fill:#b84b29">context.</text>
<text x="64" y="475" font-size="17" fill="#626b6a">Keep the relationships.</text>
<text x="64" y="503" font-size="17" fill="#626b6a">Keep the ordinary schema.</text>
<text x="64" y="563" font-size="34" letter-spacing="-1">24 <tspan font-size="22" fill="#829080">→</tspan> 11 <tspan font-size="14" letter-spacing="0">rows</tspan></text>
<svg x="455" y="131" width="760" height="570" viewBox="0 0 640 480">
          <title id="branch-title">Card 103 and its required context</title>
          <desc id="branch-desc">One card and its comments and label assignments, with necessary parent records. Counts come from the generated SQLite output.</desc>
          <defs><linearGradient id="paper" x2=".9" y2="1"><stop stop-color="#fbebd8"/><stop offset="1" stop-color="#f0c6a8"/></linearGradient><filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7e674f" flood-opacity=".12"/></filter></defs>
          <text class="column-label" x="35" y="33">PARENTS KEPT</text><text class="column-label" x="256" y="33">ROOT</text><text class="column-label" x="468" y="33">CHILDREN KEPT</text>
          <g class="traces" fill="none"><path d="M181 102H210Q228 102 228 123V226H255"/><path d="M181 190H228"/><path d="M181 278H210Q228 278 228 256V226"/><path d="M407 226H440Q456 226 456 208V179H466"/><path d="M407 226H440Q456 226 456 244V312H466"/><path d="M181 366H429Q456 366 456 339V312"/></g>
          <g class="node parent" transform="translate(34,66)"><rect width="148" height="72" rx="8"/><text class="node-label" x="17" y="26">SPACE</text><text class="node-value" id="space-name" x="17" y="51">Studio</text><text class="node-count" id="spaces-count" x="130" y="27">1</text></g>
          <g class="node parent" transform="translate(34,154)"><rect width="148" height="72" rx="8"/><text class="node-label" x="17" y="26">BOARD</text><text class="node-value" id="board-name" x="17" y="51">Build</text><text class="node-count" id="boards-count" x="130" y="27">1</text></g>
          <g class="node parent" transform="translate(34,242)"><rect width="148" height="72" rx="8"/><text class="node-label" x="17" y="26">PEOPLE</text><text class="node-value" id="people-names" x="17" y="51">Mara · Jules</text><text class="node-count" id="users-count" x="130" y="27">2</text></g>
          <g class="node parent" transform="translate(34,330)"><rect width="148" height="72" rx="8"/><text class="node-label" x="17" y="26">LABELS</text><text class="node-value" id="label-names" x="17" y="51">bug · ui</text><text class="node-count" id="labels-count" x="130" y="27">2</text></g>
          <g class="node root" transform="translate(255,166)" filter="url(#shadow)"><rect width="152" height="120" rx="10"/><path class="fold" d="M386 166"/><text class="root-label" x="20" y="29">SELECTED CARD</text><text class="root-id" id="root-id" x="20" y="70">#103</text><text class="root-state" x="20" y="98">open · 2 comments</text></g>
          <g class="node child" transform="translate(466,139)"><rect width="146" height="80" rx="8"/><text class="node-label" x="17" y="27">COMMENTS</text><text class="child-count" id="comments-count" x="17" y="58">2</text><text class="child-detail" x="43" y="58">retained</text></g>
          <g class="node child" transform="translate(466,272)"><rect width="146" height="80" rx="8"/><text class="node-label" x="17" y="27">ASSIGNMENTS</text><text class="child-count" id="card_labels-count" x="17" y="58">2</text><text class="child-detail" x="43" y="58">retained</text></g>

        </svg>
<text x="495" y="626" font-size="10" fill="#7a8079">Required parents stay. Their other branches don't.</text>
<path d="M64 643H1216" stroke="#d5d7cf"/>
<text x="64" y="677" font-family="Consolas,monospace" font-size="14">python sqlite_sprig.py board.sqlite3 --root cards --where "id=103" --out card-103.sqlite3</text>
<text x="64" y="724" font-size="11" fill="#626b6a">Authored example · copies actual data · no masking</text>
<text x="1216" y="724" font-size="11" text-anchor="end" fill="#626b6a">github.com/codex-improvement-lab/sqlite-sprig</text>
</svg>
